spring.application.name=FriendsHub API
server.port=8060
# Datasource
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/friendshub_db}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
# Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Liquibase
spring.liquibase.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/friendshub_db}
spring.liquibase.user=${DATASOURCE_USERNAME:postgres}
spring.liquibase.password=${DATASOURCE_PASSWORD:postgres}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=36000000
# Converter
spring.jackson.mapper.accept-case-insensitive-enums=true
# Logs
logging.level.root=INFO
logging.level.com.zack.friendshub=INFO
# Telegram Bot Configuration
telegram.bot.username=${TELEGRAM_BOT_USERNAME:FriendsHubBot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#OAuth
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/calendar

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

logging.level.org.springframework.security=DEBUG
