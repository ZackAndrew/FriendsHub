<!DOCTYPE html>
<html lang="uk" class="h-full bg-[#fafafa] text-neutral-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FriendsHub — Спільний графік та планування зустрічей</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/styles.css?v=4.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-[#fafafa] text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Main App Container -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Header / Navbar -->
        <header class="border-b border-neutral-200 bg-white sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <!-- Logo & Brand -->
                <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.switchTab('dashboard')">
                    <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-white">
                        <i data-lucide="compass" class="w-4 h-4"></i>
                    </div>
                    <span class="text-base font-semibold tracking-tight text-neutral-900">FriendsHub</span>
                </div>

                <!-- Nav Links (Desktop) -->
                <nav id="main-nav" class="hidden md:flex items-center gap-1">
                    <button data-tab="dashboard" class="nav-btn active px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5">
                        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                        <span>Огляд</span>
                    </button>
                    <button data-tab="common-slots" class="nav-btn px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5">
                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                        <span>Підбір часу</span>
                    </button>
                    <button data-tab="meetings" class="nav-btn px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5 relative">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        <span>Зустрічі</span>
                        <span id="badge-pending-meetings" class="hidden text-[10px] bg-neutral-900 text-white px-1.5 py-0.2 rounded-full font-semibold">0</span>
                    </button>
                    <button data-tab="availability" class="nav-btn px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5">
                        <i data-lucide="calendar-range" class="w-3.5 h-3.5"></i>
                        <span>Мій графік</span>
                    </button>
                    <button data-tab="friends" class="nav-btn px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1.5 relative">
                        <i data-lucide="users" class="w-3.5 h-3.5"></i>
                        <span>Друзі</span>
                        <span id="badge-friend-requests" class="hidden text-[10px] bg-neutral-900 text-white px-1.5 py-0.2 rounded-full font-semibold">0</span>
                    </button>
                </nav>

                <!-- User & Mode Controls -->
                <div class="flex items-center gap-2.5">
                    <!-- Backend Mode Toggle -->
                    <div id="backend-status" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-neutral-100 text-neutral-700 border border-neutral-200 cursor-pointer">
                        <span id="backend-indicator" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span id="backend-label">Live API</span>
                    </div>

                    <!-- Auth actions container -->
                    <div id="auth-actions" class="flex items-center gap-2">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Mobile Nav Bar -->
            <div class="md:hidden border-t border-neutral-200 bg-white px-2 py-1.5 flex justify-around">
                <button data-tab="dashboard" class="mobile-nav-btn active flex flex-col items-center gap-1 p-1 text-[11px] font-medium text-neutral-500">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    <span>Огляд</span>
                </button>
                <button data-tab="common-slots" class="mobile-nav-btn flex flex-col items-center gap-1 p-1 text-[11px] font-medium text-neutral-500">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>Час</span>
                </button>
                <button data-tab="meetings" class="mobile-nav-btn flex flex-col items-center gap-1 p-1 text-[11px] font-medium text-neutral-500">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>Зустрічі</span>
                </button>
                <button data-tab="availability" class="mobile-nav-btn flex flex-col items-center gap-1 p-1 text-[11px] font-medium text-neutral-500">
                    <i data-lucide="calendar-range" class="w-4 h-4"></i>
                    <span>Графік</span>
                </button>
                <button data-tab="friends" class="mobile-nav-btn flex flex-col items-center gap-1 p-1 text-[11px] font-medium text-neutral-500">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Друзі</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Tabs Containers -->
            <section id="tab-dashboard" class="tab-pane active"></section>
            <section id="tab-common-slots" class="tab-pane hidden"></section>
            <section id="tab-meetings" class="tab-pane hidden"></section>
            <section id="tab-availability" class="tab-pane hidden"></section>
            <section id="tab-friends" class="tab-pane hidden"></section>
        </main>

        <!-- Footer -->
        <footer class="border-t border-neutral-200 bg-white py-5 text-center text-xs text-neutral-500">
            <p>FriendsHub — Спільний графік та планування зустрічей з друзями</p>
        </footer>
    </div>

    <!-- Modals Container -->
    <div id="modal-container" class="relative z-50"></div>

    <!-- Application Scripts -->
    <script type="module" src="/js/app.js?v=6.0"></script>
</body>
</html>
