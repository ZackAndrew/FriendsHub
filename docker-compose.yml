services:
  db:
    image: postgres:14-alpine
    container_name: friendshub_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-friendshub_db}
      POSTGRES_USER: ${DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME:-postgres} -d ${DB_NAME:-friendshub_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friendshub_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8060:8060"
    environment:
      DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:postgresql://db:5432/friendshub_db}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-postgres}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-postgres}
      SERVER_PORT: ${SERVER_PORT:-8060}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: friendshub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
