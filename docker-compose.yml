services:
  db:
    image: postgres:14-alpine
    container_name: friendshub_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friendshub_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8060:8060"
    env_file:
      - ./.env

  ngrok:
    image: ngrok/ngrok:latest
    container_name: friendshub_ngrok
    restart: always
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "host.docker.internal:8060", "--log=stdout"]
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
